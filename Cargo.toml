[workspace]
resolver = "3"
members = ["crates/kynvpn-core", "crates/kynvpn-tunnel", "app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.95"
repository = "https://github.com/Shells-com/kynvpn-mobile"

[workspace.dependencies]
kynvpn-core = { path = "crates/kynvpn-core" }
pktkit = { version = "0.1.11", default-features = false, features = ["wg"] }
stipple = "0.0.9"
base64 = "0.23"
thiserror = "2"
libc = "0.2"

[profile.release]
debug = "line-tables-only"
lto = "thin"
